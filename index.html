<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Hub | famulaimya-sketch</title>
    <style>
        body { background-color: #0b0b0f; color: #e1e1e6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .header-container { background: radial-gradient(circle, #161622 0%, #0b0b0f 100%); padding: 40px 20px; border-bottom: 1px solid #1f1f2e; }
        h1 { color: #ffffff; font-size: 2.5rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .no-key { color: #00ff88; font-size: 1.3rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; text-shadow: 0 0 8px rgba(0,255,136,0.6); }
        .sub-text { color: #8a8a9e; font-size: 1rem; margin-bottom: 20px; }
        .tg-support { display: inline-block; background: #24A1DE; color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(36,161,222,0.3); }
        .tg-support:hover { background: #1d82b3; transform: scale(1.05); }
        .grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 25px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: #13131a; border: 1px solid #262636; border-radius: 16px; width: 280px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.7); transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { border-color: #00ff88; transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0,255,136,0.15); }
        .card h3 { margin: 0 0 10px 0; color: #ffffff; font-size: 1.4rem; }
        .status { font-size: 0.9rem; margin-bottom: 20px; padding: 5px 10px; border-radius: 20px; display: inline-block; }
        .status.online { background: rgba(0,255,136,0.1); color: #00ff88; }
        .status.updated { background: rgba(255,170,0,0.1); color: #ffaa00; }
        .btn { background: #00ff88; color: #050507; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background: #00cc6e; box-shadow: 0 0 15px rgba(0,255,136,0.4); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🚀 Скрипт Хаб famulaimya-sketch 🚀</h1>
        <div class="no-key">🔒 БЕЗ КЛЮЧЕВОЙ СИСТЕМЫ / NO KEY SYSTEM 🔒</div>
        <p class="sub-text">Все скрипты обновлены под актуальные читы и работают в 1 клик</p>
        <a href="https://t.me" target="_blank" class="tg-support">✈️ Поддержка в Telegram: @naitlesser</a>
    </div>

    <div class="grid">
        <!-- ПЛАШКА BLOX FRUITS (УЖЕ НАСТРОЕНА) -->
        <div class="card">
            <div>
                <h3>Blox Fruits</h3>
                <span class="status online">● Работает ✅</span>
            </div>
            <button class="btn" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(&quot;https://pastebin.com;))()'); alert('Скрипт для Blox Fruits скопирован!');">Копировать скрипт</button>
        </div>

        <!-- ОСТАЛЬНЫЕ ПЛАШКИ ТЫ СМОЖЕШЬ НАСТРОИТЬ ТАК ЖЕ -->
        <div class="card">
            <div>
                <h3>Rivals</h3>
                <span class="status updated">● Обновлен 🔥</span>
            </div>
            <button class="btn" onclick="navigator.clipboard.writeText('alert(&quot;Скрипт еще не добавлен!&quot;)');">Копировать скрипт</button>
        </div>
    </div>

</body>
</html>
