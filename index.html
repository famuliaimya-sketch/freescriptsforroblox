<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Hub</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #00ff88; }
        .grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; border: 2px solid #333; border-radius: 12px; width: 250px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; }
        .card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .card h3 { margin-top: 0; color: #fff; }
        .btn { background: #00ff88; color: black; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:hover { background: #00cc6e; }
    </style>
</head>
<body>

    <h1>🚀 Мой Скрипт Хаб 🚀</h1>
    <p>Выбирай игру и копируй скрипт!</p>

    <div class="grid">
        <!-- Плашка 1 -->
        <div class="card">
            <h3>Blox Fruits</h3>
            <p>Статус: Работает ✅</p>
            <button class="btn" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(&quot;https://githubusercontent.com;))()'); alert('Скрипт скопирован!');">Копировать скрипт</button>
        </div>

        <!-- Плашка 2 -->
        <div class="card">
            <h3>Pet Simulator</h3>
            <p>Статус: Работает ✅</p>
            <button class="btn" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(&quot;https://githubusercontent.com;))()'); alert('Скрипт скопирован!');">Копировать скрипт</button>
        </div>

        <!-- Плашка 3 -->
        <div class="card">
            <h3>Brookhaven</h3>
            <p>Статус: Обновлен 🔥</p>
            <button class="btn" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(&quot;https://githubusercontent.com;))()'); alert('Скрипт скопирован!');">Копировать скрипт</button>
        </div>
    </div>

</body>
</html>
